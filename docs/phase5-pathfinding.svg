<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>Server-authoritative pathfinding and NPCs</title>
<desc>When the world is ready, GameManager.InitializePathfinding builds the TerrainGraphIntegration graph on the server and disables the component on pure clients. Builds, destroys, collapses and terrain edits invalidate the graph on the server. PathfindingAgent requests paths and moves only on the server, targeting the nearest player, and clients follow each agent through its server-authoritative NetworkTransform.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.label .th{fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.head{stroke:#888780}
.frame{fill:none;stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.label .th{fill:#F1EFE8}
.arr{stroke:#B4B2A9}.head{stroke:#B4B2A9}.frame{stroke:#888780}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="30" y="20" width="410" height="520" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="235" y="46" text-anchor="middle" dominant-baseline="central">Server (or host)</text></g>
<rect class="frame" x="460" y="20" width="190" height="520" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="555" y="46" text-anchor="middle" dominant-baseline="central">Clients</text></g>
<g class="gray"><rect x="45" y="70" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="88" text-anchor="middle" dominant-baseline="central">InitializeGameLogic</text><text class="ts" x="140" y="108" text-anchor="middle" dominant-baseline="central">World ready</text></g>
<g class="teal"><rect x="45" y="166" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="184" text-anchor="middle" dominant-baseline="central">Init pathfinding</text><text class="ts" x="140" y="204" text-anchor="middle" dominant-baseline="central">InitializePathfinding</text></g>
<g class="teal"><rect x="45" y="262" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="280" text-anchor="middle" dominant-baseline="central">Pathfinding graph</text><text class="ts" x="140" y="300" text-anchor="middle" dominant-baseline="central">TerrainGraphIntegration</text></g>
<g class="teal"><rect x="255" y="262" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">World changes</text><text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">Build, destroy, edit</text></g>
<g class="teal"><rect x="45" y="358" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="376" text-anchor="middle" dominant-baseline="central">PathfindingAgent</text><text class="ts" x="140" y="396" text-anchor="middle" dominant-baseline="central">Server: path + move</text></g>
<g class="teal"><rect x="255" y="358" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="376" text-anchor="middle" dominant-baseline="central">Nearest player</text><text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">Every 0.5 s</text></g>
<g class="teal"><rect x="45" y="454" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="472" text-anchor="middle" dominant-baseline="central">NetworkTransform</text><text class="ts" x="140" y="492" text-anchor="middle" dominant-baseline="central">Server authoritative</text></g>
<g class="gray"><rect x="475" y="70" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="88" text-anchor="middle" dominant-baseline="central">InitializeGameLogic</text><text class="ts" x="555" y="108" text-anchor="middle" dominant-baseline="central">World ready</text></g>
<g class="purple"><rect x="475" y="166" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="184" text-anchor="middle" dominant-baseline="central">Pathfinding off</text><text class="ts" x="555" y="204" text-anchor="middle" dominant-baseline="central">Component disabled</text></g>
<g class="purple"><rect x="475" y="454" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="472" text-anchor="middle" dominant-baseline="central">Agent copy</text><text class="ts" x="555" y="492" text-anchor="middle" dominant-baseline="central">Follows transform</text></g>
<line class="arr" x1="140" y1="126" x2="140" y2="164" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="222" x2="140" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="318" x2="140" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="414" x2="140" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="255" y1="290" x2="237" y2="290" marker-end="url(#arrow)"/>
<line class="arr" x1="255" y1="386" x2="237" y2="386" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="126" x2="555" y2="164" marker-end="url(#arrow)"/>
<line class="arr" x1="235" y1="482" x2="473" y2="482" marker-end="url(#arrow)"/>
</svg>
