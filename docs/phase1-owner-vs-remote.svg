<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img">
<title>Owner and remote copies of the networked player</title>
<desc>On the owning machine PlayerInput is enabled, Update moves the CharacterController and the client-authoritative NetworkTransform and NetworkAnimator send state. On every other machine PlayerInput stays disabled, Update returns early, and the NetworkTransform and NetworkAnimator apply the owner state.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.label .th{fill:#2C2C2A}.label .ts,.note{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.head{stroke:#888780}
.frame{fill:none;stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.label .th{fill:#F1EFE8}.label .ts,.note{fill:#D3D1C7}
.arr{stroke:#B4B2A9}.head{stroke:#B4B2A9}.frame{stroke:#888780}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="40" y="20" width="290" height="320" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="185" y="46" text-anchor="middle" dominant-baseline="central">Owner's copy</text><text class="ts" x="185" y="66" text-anchor="middle" dominant-baseline="central">The machine that controls it</text></g>
<rect class="frame" x="350" y="20" width="290" height="320" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="495" y="46" text-anchor="middle" dominant-baseline="central">Remote copy</text><text class="ts" x="495" y="66" text-anchor="middle" dominant-baseline="central">Every other machine</text></g>
<g class="purple"><rect x="60" y="90" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="108" text-anchor="middle" dominant-baseline="central">PlayerInput enabled</text><text class="ts" x="185" y="128" text-anchor="middle" dominant-baseline="central">OnStartClient, IsOwner</text></g>
<g class="purple"><rect x="60" y="180" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="198" text-anchor="middle" dominant-baseline="central">Update() moves player</text><text class="ts" x="185" y="218" text-anchor="middle" dominant-baseline="central">Once movement is released</text></g>
<g class="purple"><rect x="60" y="270" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="185" y="288" text-anchor="middle" dominant-baseline="central">NetworkTransform/Animator</text><text class="ts" x="185" y="308" text-anchor="middle" dominant-baseline="central">Client authoritative: sends</text></g>
<g class="gray"><rect x="370" y="90" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="108" text-anchor="middle" dominant-baseline="central">PlayerInput disabled</text><text class="ts" x="495" y="128" text-anchor="middle" dominant-baseline="central">Switched off in Awake</text></g>
<g class="gray"><rect x="370" y="180" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="198" text-anchor="middle" dominant-baseline="central">Update() returns early</text><text class="ts" x="495" y="218" text-anchor="middle" dominant-baseline="central">Not the owner</text></g>
<g class="gray"><rect x="370" y="270" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="288" text-anchor="middle" dominant-baseline="central">NetworkTransform/Animator</text><text class="ts" x="495" y="308" text-anchor="middle" dominant-baseline="central">Applies owner's state</text></g>
<line class="arr" x1="185" y1="146" x2="185" y2="178" marker-end="url(#arrow)"/>
<line class="arr" x1="185" y1="236" x2="185" y2="268" marker-end="url(#arrow)"/>
<line class="arr" x1="310" y1="298" x2="368" y2="298" marker-end="url(#arrow)"/>
<text class="ts note" x="340" y="372" text-anchor="middle" dominant-baseline="central">State travels through the host (listen server) to the other clients</text>
</svg>
