<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Player startup flow</title>
<desc>NetworkBootstrap starts the network; the server spawns WorldState, which calls BeginStreaming with the shared seed on every machine. The world path (TerrainStreamingController to InitializeGameLogic) and the player path (WorldPlayerSpawner, ThirdPersonController.OnStartClient, RegisterLocalPlayer, which registers the player as a streaming target) converge in GameManager.SetupLocalPlayer, which hands the player to OrbitCamera, Builder and OnTerrainReady.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.label .th{fill:#2C2C2A}.label .ts,.note{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.head{stroke:#888780}
.frame{fill:none;stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.label .th{fill:#F1EFE8}.label .ts,.note{fill:#D3D1C7}
.arr{stroke:#B4B2A9}.head{stroke:#B4B2A9}.frame{stroke:#888780}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="60" y="40" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="58" text-anchor="middle" dominant-baseline="central">WorldState</text><text class="ts" x="180" y="78" text-anchor="middle" dominant-baseline="central">BeginStreaming(seed)</text></g>
<g class="teal"><rect x="60" y="136" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="154" text-anchor="middle" dominant-baseline="central">TerrainStreamingController</text><text class="ts" x="180" y="174" text-anchor="middle" dominant-baseline="central">onInitialChunksLoaded</text></g>
<g class="gray"><rect x="60" y="232" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="250" text-anchor="middle" dominant-baseline="central">InitializeGameLogic()</text><text class="ts" x="180" y="270" text-anchor="middle" dominant-baseline="central">GameManager: world ready</text></g>
<g class="purple"><rect x="380" y="40" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="58" text-anchor="middle" dominant-baseline="central">NetworkBootstrap</text><text class="ts" x="500" y="78" text-anchor="middle" dominant-baseline="central">Starts host or client</text></g>
<g class="purple"><rect x="380" y="136" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="154" text-anchor="middle" dominant-baseline="central">WorldPlayerSpawner</text><text class="ts" x="500" y="174" text-anchor="middle" dominant-baseline="central">Spawns on loaded ground</text></g>
<g class="purple"><rect x="380" y="232" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="250" text-anchor="middle" dominant-baseline="central">OnStartClient (owner)</text><text class="ts" x="500" y="270" text-anchor="middle" dominant-baseline="central">ThirdPersonController</text></g>
<g class="gray"><rect x="380" y="328" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="346" text-anchor="middle" dominant-baseline="central">RegisterLocalPlayer()</text><text class="ts" x="500" y="366" text-anchor="middle" dominant-baseline="central">GameManager: hold, stream</text></g>
<g class="gray"><rect x="210" y="424" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="350" y="442" text-anchor="middle" dominant-baseline="central">SetupLocalPlayer()</text><text class="ts" x="350" y="462" text-anchor="middle" dominant-baseline="central">Wait, snap to ground, release</text></g>
<g class="gray"><rect x="70" y="520" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="155" y="538" text-anchor="middle" dominant-baseline="central">OrbitCamera</text><text class="ts" x="155" y="558" text-anchor="middle" dominant-baseline="central">SetTarget(player)</text></g>
<g class="gray"><rect x="265" y="520" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="350" y="538" text-anchor="middle" dominant-baseline="central">Builder</text><text class="ts" x="350" y="558" text-anchor="middle" dominant-baseline="central">SetPlayer(player)</text></g>
<g class="gray"><rect x="460" y="520" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545" y="538" text-anchor="middle" dominant-baseline="central">OnTerrainReady</text><text class="ts" x="545" y="558" text-anchor="middle" dominant-baseline="central">+ pathfinding, once</text></g>
<line class="arr" x1="380" y1="68" x2="304" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="96" x2="180" y2="134" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="192" x2="180" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="96" x2="500" y2="134" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="192" x2="500" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="288" x2="500" y2="326" marker-end="url(#arrow)"/>
<path class="arr" d="M180 288 L180 452 L206 452" marker-end="url(#arrow)"/>
<path class="arr" d="M500 384 L500 452 L494 452" marker-end="url(#arrow)"/>
<path class="arr" d="M380 356 L340 356 L340 164 L304 164" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line class="arr" x1="350" y1="480" x2="350" y2="516" marker-end="url(#arrow)"/>
<path class="arr" d="M350 500 L155 500 L155 516" marker-end="url(#arrow)"/>
<path class="arr" d="M350 500 L545 500 L545 516" marker-end="url(#arrow)"/>
<g class="teal"><rect x="60" y="604" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts note" x="80" y="610" dominant-baseline="central">World</text>
<g class="purple"><rect x="140" y="604" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts note" x="160" y="610" dominant-baseline="central">Network / player</text>
<g class="gray"><rect x="290" y="604" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts note" x="310" y="610" dominant-baseline="central">GameManager and systems</text>
<line class="arr" x1="470" y1="610" x2="500" y2="610" stroke-dasharray="4 3"/><text class="ts note" x="508" y="610" dominant-baseline="central">RegisterStreamingTarget</text>
</svg>
