<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
<title>Networked piece removal flow</title>
<desc>A destroy request from the owner client (piece IDs under the preview, sent with ServerRequestDestruct) and a collapse found by the RecalculationWorker end in BuildingArea.RemoveWeakConstructedItem or RemoveWeakConstructedItems on the server. Builder.OnConstructedItemRemoved then removes the record from the NetworkBuildingArea and invalidates pathfinding, and other clients destroy their local copy when Pieces.OnChange reports the removal.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.label .th{fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.head{stroke:#888780}
.frame{fill:none;stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.label .th{fill:#F1EFE8}
.arr{stroke:#B4B2A9}.head{stroke:#B4B2A9}.frame{stroke:#888780}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="30" y="20" width="170" height="610" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="115" y="46" text-anchor="middle" dominant-baseline="central">Owner client</text></g>
<rect class="frame" x="210" y="20" width="260" height="610" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="340" y="46" text-anchor="middle" dominant-baseline="central">Server (or host)</text></g>
<rect class="frame" x="480" y="20" width="170" height="610" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="565" y="46" text-anchor="middle" dominant-baseline="central">Other clients</text></g>
<g class="purple"><rect x="40" y="70" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="88" text-anchor="middle" dominant-baseline="central">OnDestruct</text><text class="ts" x="115" y="108" text-anchor="middle" dominant-baseline="central">IDs under preview</text></g>
<g class="teal"><rect x="225" y="70" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="88" text-anchor="middle" dominant-baseline="central">RecalculationWorker</text><text class="ts" x="340" y="108" text-anchor="middle" dominant-baseline="central">Weak pieces collapse</text></g>
<g class="teal"><rect x="225" y="166" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="184" text-anchor="middle" dominant-baseline="central">ServerRequestDestruct</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">Keep pieces in reach</text></g>
<g class="teal"><rect x="225" y="262" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">RemoveWeakConstructedItem</text><text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">BuildingArea: one or all weak</text></g>
<g class="teal"><rect x="225" y="358" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="376" text-anchor="middle" dominant-baseline="central">OnConstructedItemRemoved</text><text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">Builder: record + pathfinding</text></g>
<g class="teal"><rect x="225" y="454" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="472" text-anchor="middle" dominant-baseline="central">NetworkBuildingArea</text><text class="ts" x="340" y="492" text-anchor="middle" dominant-baseline="central">RemovePiece → SyncDictionary</text></g>
<g class="purple"><rect x="490" y="454" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="472" text-anchor="middle" dominant-baseline="central">Pieces.OnChange</text><text class="ts" x="565" y="492" text-anchor="middle" dominant-baseline="central">Record removed</text></g>
<g class="purple"><rect x="490" y="550" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="568" text-anchor="middle" dominant-baseline="central">Local copy</text><text class="ts" x="565" y="588" text-anchor="middle" dominant-baseline="central">Destroyed</text></g>
<path class="arr" d="M115 126 L115 194 L223 194" marker-end="url(#arrow)"/>
<path class="arr" d="M455 98 L462 98 L462 290 L457 290" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="222" x2="340" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="318" x2="340" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="414" x2="340" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="455" y1="482" x2="488" y2="482" marker-end="url(#arrow)"/>
<line class="arr" x1="565" y1="510" x2="565" y2="548" marker-end="url(#arrow)"/>
</svg>
