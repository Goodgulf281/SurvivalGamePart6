<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
<title>World save and load</title>
<desc>On server start WorldState loads world.json: the seed and terrain edits go into the SyncVar and SyncList, which clients receive to stream the same world, and the pieces are queued in Builder by chunk. When a chunk loads on the server its saved pieces are rebuilt through the normal build path, so NetworkBuildingArea records give every client, late joiners included, local copies. SaveWorld writes the save when the server stops or on the save key.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.label .th{fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.head{stroke:#888780}
.frame{fill:none;stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .th{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.label .th{fill:#F1EFE8}
.arr{stroke:#B4B2A9}.head{stroke:#B4B2A9}.frame{stroke:#888780}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="frame" x="30" y="20" width="410" height="610" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="235" y="46" text-anchor="middle" dominant-baseline="central">Server (or host)</text></g>
<rect class="frame" x="460" y="20" width="190" height="610" rx="16" stroke-width="0.5" stroke-dasharray="5 4"/>
<g class="label"><text class="th" x="555" y="46" text-anchor="middle" dominant-baseline="central">Clients</text></g>
<g class="teal"><rect x="45" y="70" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="88" text-anchor="middle" dominant-baseline="central">OnStartServer</text><text class="ts" x="140" y="108" text-anchor="middle" dominant-baseline="central">WorldState loads save</text></g>
<g class="gray"><rect x="255" y="70" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="88" text-anchor="middle" dominant-baseline="central">world.json</text><text class="ts" x="340" y="108" text-anchor="middle" dominant-baseline="central">WorldSaveFile</text></g>
<g class="teal"><rect x="45" y="166" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="184" text-anchor="middle" dominant-baseline="central">Seed + edits</text><text class="ts" x="140" y="204" text-anchor="middle" dominant-baseline="central">SyncVar + SyncList</text></g>
<g class="teal"><rect x="45" y="262" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="280" text-anchor="middle" dominant-baseline="central">QueueSavedPieces</text><text class="ts" x="140" y="300" text-anchor="middle" dominant-baseline="central">Builder, by chunk</text></g>
<g class="teal"><rect x="255" y="262" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">SaveWorld()</text><text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">On stop or save key</text></g>
<g class="teal"><rect x="45" y="358" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="376" text-anchor="middle" dominant-baseline="central">Chunk loaded</text><text class="ts" x="140" y="396" text-anchor="middle" dominant-baseline="central">onChunkLoadComplete</text></g>
<g class="teal"><rect x="45" y="454" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="472" text-anchor="middle" dominant-baseline="central">Rebuild pieces</text><text class="ts" x="140" y="492" text-anchor="middle" dominant-baseline="central">Normal build path</text></g>
<g class="teal"><rect x="45" y="550" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="568" text-anchor="middle" dominant-baseline="central">NetworkBuildingArea</text><text class="ts" x="140" y="588" text-anchor="middle" dominant-baseline="central">Piece records</text></g>
<g class="purple"><rect x="475" y="166" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="184" text-anchor="middle" dominant-baseline="central">Seed + edits</text><text class="ts" x="555" y="204" text-anchor="middle" dominant-baseline="central">Stream, replay edits</text></g>
<g class="purple"><rect x="475" y="550" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="568" text-anchor="middle" dominant-baseline="central">Local copies</text><text class="ts" x="555" y="588" text-anchor="middle" dominant-baseline="central">Late joiners too</text></g>
<line class="arr" x1="255" y1="98" x2="237" y2="98" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="262" x2="340" y2="128" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="126" x2="140" y2="164" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="222" x2="140" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="318" x2="140" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="414" x2="140" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="140" y1="510" x2="140" y2="548" marker-end="url(#arrow)"/>
<path class="arr" d="M235 194 L334 194 A6 6 0 0 1 346 194 L473 194" marker-end="url(#arrow)"/>
<line class="arr" x1="235" y1="578" x2="473" y2="578" marker-end="url(#arrow)"/>
</svg>
